<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Produtos</title>
    <link rel="stylesheet" href="gestao.css">
</head>
<body>
    <header class="header-admin">
        <h1>Painel de Gestão - SOS Alimentos</h1>
    </header>

    <main class="container">
        <!-- BLOCO 1: IMPORTAÇÃO DE PLANILHA -->
        <section class="card">
            <h2>Importar Planilha (CSV)</h2>
            <div class="upload-area">
                <input type="file" id="arquivoCsv" accept=".csv">
                <button class="btn" onclick="preVisualizarCSV()">Ler Planilha</button>
            </div>
            
            <div id="areaPreview" class="hidden">
                <h3>Revisão de Importação</h3>
                <div class="table-container">
                    <table id="tabelaPreview">
                        <thead>
                            <tr>
                                <th>Nome Limpo</th>
                                <th>Unidade</th>
                                <th>Preço</th>
                                <th>Ativo</th>
                            </tr>
                        </thead>
                        <tbody id="corpoPreview"></tbody>
                    </table>
                </div>
                <button class="btn btn-success mt-1" onclick="confirmarImportacao()">Confirmar e Salvar no Banco</button>
            </div>
        </section>

        <!-- BLOCO 2: FORMULÁRIO MANUAL (Criar e Editar) -->
        <section class="card">
            <h2 id="tituloFormulario">Cadastrar Novo Produto</h2>
            <form id="formProduto" onsubmit="salvarProduto(event)">
                <input type="hidden" id="produtoId">
                
                <div class="form-grid">
                    <div class="input-group">
                        <label>Nome do Produto</label>
                        <input type="text" id="nomeProduto" required>
                    </div>
                    <div class="input-group">
                        <label>Unidade (Ex: 1kg, UN)</label>
                        <input type="text" id="unidade" required>
                    </div>
                    <div class="input-group">
                        <label>Valor (R$)</label>
                        <input type="number" id="valorProduto" step="0.01" required>
                    </div>
                    <div class="input-group checkbox-group">
                        <input type="checkbox" id="ativo" checked>
                        <label for="ativo">Produto Ativo na Loja</label>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" onclick="limparFormulario()">Cancelar Edição</button>
                    <button type="submit" class="btn">Salvar Produto</button>
                </div>
            </form>
        </section>

        <!-- BLOCO 3: TABELA DE PRODUTOS CADASTRADOS -->
        <section class="card">
            <h2>Produtos Cadastrados</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Unid.</th>
                            <th>Valor</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela">
                        <!-- JS vai injetar os itens aqui -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="gestao.js"></script>
</body>
</html>

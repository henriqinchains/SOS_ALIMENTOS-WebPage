<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS ALIMENTOS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <!-- Navegação Principal -->
        <div class="nav-bar-principal">
            <nav>
                <div class="first-line">
                    <a href="#">WHATSAPP</a>
                    <a href="#">INSTAGRAM</a>
                </div>
            </nav>
        </div>
        
        <!-- Navegação Secundária -->
        <div class="nav-bar-secundaria">
            <div class="logo">
                <h2>SOS ALIMENTOS</h2>
            </div>
            <div class="nav-links">
                <a href="#ofertas">Ofertas da semana</a>
                <a href="#produtos">Produtos</a>
                <a href="gestao.html">Gestão</a>
            </div>
        </div>
    </header>

    <!-- Container Principal do SPA -->
    <main id="app">
        
        <!-- PÁGINA 1: OFERTAS (CARROSSEL) -->
        <section id="ofertas" class="page active">
            <div class="titulo-pagina">
                <h2>Ofertas em Destaque</h2>
            </div>
            
            <!-- Carrossel Padrão -->
            <div id="banner-carrossel" class="carrossel">
                <div class="slides-container">
                    <!-- Substitua as URLs pelas suas imagens -->
                    <div class="slide ativo" style="background-color: #ff9f43;">Banner 1: Quarta das Frutas</div>
                    <div class="slide" style="background-color: #ee5253;">Banner 2: Fim de Semana da Carne</div>
                    <div class="slide" style="background-color: #10ac84;">Banner 3: Limpeza em Promoção</div>
                </div>
                <button class="botao-ant" onclick="mudarSlide(-1)">&#10094;</button>
                <button class="botao-prox" onclick="mudarSlide(1)">&#10095;</button>
            </div>

            <!-- Caixa de Pesquisa -->
            <div class="pesquisa-container">
                <input type="text" id="search-input-ofertas" placeholder="O que você está procurando? (Ex: Arroz, Feijão...)">
                <button class="btn-pesquisar">Buscar</button>
            </div>

            <div class="titulo-secao">
                <h3>Produtos em Promoção</h3>
            </div>

            <!-- Grid de Produtos em Promoção -->
            <div class="grid-produtos" id="grid-promocoes">
                <p class="msg-estado">Carregando promoções...</p>
            </div>
        </section>

        <!-- PÁGINA 2: PRODUTOS (PESQUISA + GRID) -->
        <section id="produtos" class="page">
            <div class="titulo-pagina">
                <h2>Nossos Produtos</h2>
            </div>
            
            <!-- Caixa de Pesquisa -->
            <div class="pesquisa-container">
                <input type="text" id="search-input-produtos" placeholder="O que você está procurando? (Ex: Arroz, Feijão...)">
                <button class="btn-pesquisar">Buscar</button>
            </div>

            <!-- Grid de Produtos -->
            <div class="grid-produtos" id="grid-produtos">
                <p class="msg-estado">Carregando produtos...</p>
            </div>
        </section>

        <!-- PÁGINA 3: GESTÃO -->
        <section id="gestao" class="page">
            <div class="titulo-pagina">
                <h2>Área de Gestão</h2>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
